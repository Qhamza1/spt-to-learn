<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPT LEARN | الرئيسية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="splash-screen">
        <h1 style="color:var(--primary); font-family: 'Cairo';">SPT LEARN</h1>
        <div class="fas fa-spinner fa-spin" style="font-size: 2rem; color: var(--secondary);"></div>
    </div>

    <div class="container">
        <div id="auth-screen" class="screen">
            <div class="card" style="text-align: center;">
                <img src="logo.png" class="auth-logo" alt="SPT Logo" onerror="this.src='https://via.placeholder.com/100?text=SPT'">
                
                <h2>مرحباً بك في SPT</h2>
                <p style="opacity: 0.7;">اختر بوابة الدخول للاستمرار</p>
                
                <div class="role-selection">
                    <div id="role-t" class="role-btn" onclick="setRole('teacher')">
                        <i class="fas fa-chalkboard-teacher"></i><br>بوابة المعلمين
                    </div>
                    <div id="role-s" class="role-btn" onclick="setRole('student')">
                        <i class="fas fa-user-graduate"></i><br>بوابة الطلاب
                    </div>
                </div>

                <input type="email" id="login-email" placeholder="البريد الإلكتروني">
                <input type="password" id="login-pass" placeholder="كلمة السر">
                <button class="btn-action" onclick="handleLogin()">
                    <i class="fas fa-sign-in-alt"></i> دخول للتطبيق
                </button>
            </div>
        </div>

        <div id="ai-screen" class="screen hidden">
            <div class="card">
                <div id="chat-box">
                    <div class="msg bot">أهلاً بك يا بطل! أنا SPT AI، اسألني أي سؤال في منهجك.</div>
                </div>
                <div style="display: flex; gap: 8px; margin-top: 15px;">
                    <input type="text" id="ai-input" placeholder="اكتب سؤالك هنا...">
                    <button class="btn-action" style="width: 60px; margin-top:0;" onclick="askAI()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="wallet-screen" class="screen hidden">
            <div class="card wallet-card">
                <p>رصيدك الحالي</p>
                <h1>0.00 EGP</h1>
            </div>
            <div class="card">
                <h4><i class="fas fa-coins"></i> شحن الرصيد</h4>
                <button class="btn-action" style="background:#ee1c25" onclick="depositVodafone()">
                    <i class="fas fa-mobile-alt"></i> فودافون كاش
                </button>
                <button class="btn-action" style="background:#7c3aed" disabled>
                    <i class="fas fa-university"></i> إنستا باي (قريباً)
                </button>
            </div>
        </div>

        <div id="settings-screen" class="screen hidden">
            <div class="card">
                <div class="menu-item"><i class="fas fa-user-circle"></i> <span>الملف الشخصي</span></div>
                
                <div class="menu-item" onclick="changeLanguage('ar')">
                    <i class="fas fa-language"></i> <span>تغيير اللغة (العربية)</span>
                </div>

                <div class="menu-item" onclick="toggleTheme()">
                    <i class="fas fa-adjust"></i> <span>تبديل الوضع (ليلي/نهاري)</span>
                </div>
                
                <div class="menu-item" onclick="contactSupport()">
                    <i class="fab fa-whatsapp"></i> <span>تواصل مع الدعم</span>
                </div>

                <div class="social-links">
                    <a href="javascript:void(0)" onclick="openSocial('fb')" style="color:#1877f2;"><i class="fab fa-facebook"></i></a>
                    <a href="javascript:void(0)" onclick="openSocial('ig')" style="color:#e4405f;"><i class="fab fa-instagram"></i></a>
                </div>
            </div>
            
            <button class="btn-action" style="background: var(--danger);" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
            </button>
        </div>
    </div>

    <div id="main-nav" class="bottom-nav hidden">
        <div class="nav-item" onclick="navTo('ai-screen', this)"><i class="fas fa-robot"></i><span>البوت</span></div>
        <div class="nav-item" onclick="navTo('wallet-screen', this)"><i class="fas fa-wallet"></i><span>المحفظة</span></div>
        <div class="nav-item" onclick="navTo('settings-screen', this)"><i class="fas fa-cog"></i><span>الإعدادات</span></div>
    </div>

    <script type="module" src="script.js"></script>

    <script>
        const hideSplash = () => {
            const splash = document.getElementById('splash-screen');
            if (splash) {
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                }, 600);
            }
        };

        // إخفاء الشاشة عند اكتمال التحميل أو بعد 3 ثواني كحد أقصى
        window.addEventListener('load', hideSplash);
        setTimeout(hideSplash, 3000); 

        // إظهار البار السفلي لو مسجل دخول
        if(localStorage.getItem('isLoggedIn') === 'true') {
            const nav = document.getElementById('main-nav');
            if(nav) nav.classList.remove('hidden');
        }
    </script>
</body>
</html>
